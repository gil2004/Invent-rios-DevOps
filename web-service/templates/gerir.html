{% extends "base.html" %}
{% block conteudo %}
  {% if msg %}<p class="msg">{{ msg }}</p>{% endif %}
  <h2>Novo item</h2>
  <form method="post" action="{{ url_for('criar') }}">
    <label for="novo-nome">Nome</label>
    <input id="novo-nome" name="nome" required>
    <label for="novo-quantidade">Quantidade</label>
    <input id="novo-quantidade" name="quantidade" type="number" min="0">
    <label for="novo-preco">Preço</label>
    <input id="novo-preco" name="preco" type="number" min="0" step="0.01">
    <button>Criar</button>
  </form>
  <h2>Itens</h2>
  <table>
    <tr><th>Nome</th><th>Quantidade</th><th>Preço</th><th></th></tr>
    {% for item in itens %}
    <tr>
      <td><label for="nome-{{ item.id }}" class="oculto">Nome</label>
        <input id="nome-{{ item.id }}" form="alterar-{{ item.id }}" name="nome" value="{{ item.nome }}"></td>
      <td><label for="quantidade-{{ item.id }}" class="oculto">Quantidade</label>
        <input id="quantidade-{{ item.id }}" form="alterar-{{ item.id }}" name="quantidade" type="number" min="0" value="{{ item.quantidade }}"></td>
      <td><label for="preco-{{ item.id }}" class="oculto">Preço</label>
        <input id="preco-{{ item.id }}" form="alterar-{{ item.id }}" name="preco" type="number" min="0" step="0.01" value="{{ item.preco }}"></td>
      <td>
        <form id="alterar-{{ item.id }}" method="post" action="{{ url_for('alterar', item_id=item.id) }}" style="display:inline">
          <button>Guardar</button>
        </form>
        <form method="post" action="{{ url_for('apagar', item_id=item.id) }}" style="display:inline">
          <button class="apagar">Apagar</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4">Ainda não há itens.</td></tr>
    {% endfor %}
  </table>
{% endblock %}
