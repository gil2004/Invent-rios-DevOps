# STG: build das imagens de PRD (requirements-prd.txt) e ambiente para os testes de integração
name: inventario-devops

services:
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - auth-service
      - itens-service
      - web-service
    restart: unless-stopped
    networks:
      - inventario-net

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: ghcr.io/gil2004/inventario-auth:${TAG:-latest}
    deploy:
      replicas: 2
    restart: unless-stopped
    networks:
      - inventario-net

  itens-service:
    build:
      context: .
      dockerfile: itens-service/Dockerfile
    image: ghcr.io/gil2004/inventario-itens:${TAG:-latest}
    environment:
      AUTH_URL: http://auth-service:5001
      DB_PATH: /data/itens.db
    volumes:
      - itens-data:/data
    deploy:
      replicas: 2
    restart: unless-stopped
    depends_on:
      - auth-service
    networks:
      - inventario-net

  web-service:
    build:
      context: .
      dockerfile: web-service/Dockerfile
    image: ghcr.io/gil2004/inventario-web:${TAG:-latest}
    environment:
      ITENS_URL: http://itens-service:5002
      AUTH_URL: http://auth-service:5001
    deploy:
      replicas: 2
    restart: unless-stopped
    depends_on:
      - itens-service
    networks:
      - inventario-net

networks:
  inventario-net:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  itens-data: