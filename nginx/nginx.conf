# Porta de entrada única (HTTPS): o TLS termina aqui; para dentro os pedidos seguem em HTTP pela rede interna.
server {
    listen 443 ssl;
    server_name localhost;

    # Certificado self-signed (gerado com openssl em nginx/certs, montado pelo compose)
    ssl_certificate     /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Interface web (o que o cliente vê no browser)
    location / {
        proxy_pass http://web-service:5003;
        proxy_set_header Host $http_host;
    }

    # API REST/JSON
    location /api/itens { proxy_pass http://itens-service:5002; }

    location = /health/itens { proxy_pass http://itens-service:5002/health; }
    location = /health/auth  { proxy_pass http://auth-service:5001/health; }
    location = /health/web   { proxy_pass http://web-service:5003/health; }
}