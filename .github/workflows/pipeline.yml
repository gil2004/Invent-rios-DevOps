name: Pipeline CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  TAG: ${{ github.sha }}

jobs:
  dev:
    name: DEV - lint, unitários, segurança e tracing com Jaeger
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: mkdir -p reports
      - name: Lint (ruff)
        run: ruff check . | tee reports/dev-lint.txt
      - name: Testes unitários auth-service
        working-directory: auth-service
        run: python -m pytest -v --cov=app tests | tee ../reports/dev-unitarios-auth.txt
      - name: Testes unitários itens-service
        working-directory: itens-service
        run: python -m pytest -v --cov=app tests | tee ../reports/dev-unitarios-itens.txt
      - name: Segurança do código (bandit)
        run: bandit -r auth-service itens-service -x auth-service/tests,itens-service/tests | tee reports/seguranca-bandit.txt
      - name: Segurança das bibliotecas de PRD (pip-audit)
        run: pip-audit -r requirements-prd.txt 2>&1 | tee reports/seguranca-pip-audit.txt
      - name: Subir o ambiente DEV com o Jaeger
        run: |
          docker compose -f docker-compose.dev.yml up -d --build
          sleep 10
      - name: Teste de tracing (os traces chegam ao Jaeger)
        run: python -m pytest -v tests/dev | tee reports/dev-tracing.txt
      - name: Parar o ambiente DEV
        if: always()
        run: docker compose -f docker-compose.dev.yml down
      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-dev
          path: reports/

  stg:
    name: STG - build das imagens de PRD e testes de integração
    needs: dev
    runs-on: ubuntu-latest
    environment: stg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-stg.txt
      - name: Login no GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build das imagens de PRD (só requirements-prd, tag = commit)
        run: docker compose build
      - name: Certificado HTTPS (guardado nos Secrets do GitHub)
        env:
          TLS_CRT: ${{ secrets.TLS_CRT }}
          TLS_KEY: ${{ secrets.TLS_KEY }}
        run: |
          mkdir -p nginx/certs
          printf '%s\n' "$TLS_CRT" > nginx/certs/nginx.crt
          printf '%s\n' "$TLS_KEY" > nginx/certs/nginx.key
      - name: Arrancar o ambiente
        run: |
          docker compose up -d
          sleep 10
      - name: Testes de integração
        run: |
          mkdir -p reports
          python -m pytest -v tests/integracao | tee reports/stg-integracao.txt
      - name: Publicar as imagens testadas (commit + latest)
        run: |
          docker compose push auth-service itens-service
          for s in auth itens; do
            docker tag ghcr.io/gil2004/inventario-$s:$TAG ghcr.io/gil2004/inventario-$s:latest
            docker push ghcr.io/gil2004/inventario-$s:latest
          done
      - name: Parar o ambiente
        if: always()
        run: docker compose down
      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-stg
          path: reports/

  prd:
    name: PRD - pull da imagem testada em STG para Kubernetes (sem build) e smoke tests
    needs: stg
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ferramentas de teste no runner (não entram na app)
        run: pip install -r requirements-stg.txt
      - name: Preparar o servidor de PRD - instalar o MicroK8s (runner vazio; num servidor real já existe)
        run: |
          sudo snap install microk8s --classic --channel=1.33/stable
          sudo microk8s status --wait-ready
          sudo microk8s enable dns hostpath-storage
          mkdir -p ~/.kube
          sudo microk8s config > ~/.kube/config
          kubectl wait --for=condition=available deployment --all -n kube-system --timeout=180s
          kubectl get nodes
      - name: Certificado HTTPS (guardado nos Secrets do GitHub)
        env:
          TLS_CRT: ${{ secrets.TLS_CRT }}
          TLS_KEY: ${{ secrets.TLS_KEY }}
        run: |
          mkdir -p nginx/certs
          printf '%s\n' "$TLS_CRT" > nginx/certs/nginx.crt
          printf '%s\n' "$TLS_KEY" > nginx/certs/nginx.key
      - name: Deploy da imagem testada em STG (tag = commit, sem build)
        run: |
          kubectl create configmap nginx-conf --from-file=default.conf=nginx/nginx.conf
          kubectl create secret tls nginx-tls --cert=nginx/certs/nginx.crt --key=nginx/certs/nginx.key
          sed "s/:latest/:$TAG/" k8s/prd.yml | kubectl apply -f -
          kubectl wait --for=condition=available deployment --all --timeout=300s
          kubectl get pods -o wide
      - name: Smoke tests
        env:
          BASE_URL: https://localhost:30443
        run: |
          mkdir -p reports
          python -m pytest -v tests/smoke | tee reports/prd-smoke.txt
      - name: Diagnóstico (só se falhar)
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods | tail -60
      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-prd
          path: reports/